<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; connect-src 'self' https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; img-src 'self' data:; manifest-src 'self'; base-uri 'self'; form-action 'none'">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1b1a" media="(prefers-color-scheme: dark)">
<meta name="description" content="Matrice des priorités, planning et notes, synchronisés par Google Drive.">
<title>Mes priorités</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="update-bar hidden" id="update">Une nouvelle version est disponible. <button id="update-btn">Recharger</button></div>
<div class="app">
  <aside>
    <h1><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="6" height="6" rx="1" fill="#E24B4A"/><rect x="9" y="1" width="6" height="6" rx="1" fill="#378ADD"/><rect x="1" y="9" width="6" height="6" rx="1" fill="#EF9F27"/><rect x="9" y="9" width="6" height="6" rx="1" fill="#888780"/></svg>Mes priorités</h1>
    <div class="nav" data-view="matrix" tabindex="0">▦ Matrice <span class="count" id="c-matrix"></span></div>
    <div class="nav" data-view="day" tabindex="0">◷ Planning <span class="count" id="c-day"></span></div>
    <div class="nav" data-view="notes" tabindex="0">✎ Notes</div>
    <div class="section-label">Projets <button class="ghost" id="add-project" title="Nouveau projet" aria-label="Nouveau projet">+</button></div>
    <div id="projects"></div>
    <div class="spacer"></div>
    <div class="nav" data-view="trash" tabindex="0">🗑 Corbeille <span class="count" id="c-trash"></span></div>
    <div class="nav" id="open-settings" tabindex="0">⚙ Paramètres</div>
    <div class="nav sync-chip" id="sync-chip" tabindex="0" role="button">☁ <span>Démarrage…</span></div>
  </aside>

  <main>
    <div class="topbar">
      <input class="quick" id="quick" placeholder="Nouvelle tâche…  #projet  !1 à !4  ~1h30  @demain" autocomplete="off" maxlength="500" enterkeyhint="done">
      <input class="search" id="search" placeholder="Filtrer…" autocomplete="off" type="search">
      <label class="small muted toggle"><input type="checkbox" id="show-done"> Terminées</label>
    </div>
    <div class="view" id="view-matrix"><div class="matrix" id="matrix"></div></div>
    <div class="view hidden" id="view-day"></div>
    <div class="view hidden" id="view-notes"></div>
    <div class="view hidden" id="view-trash"></div>
  </main>

  <div class="drawer hidden" id="drawer"></div>
</div>
<nav class="mobile-nav" aria-label="Navigation">
  <button data-view="matrix"><span class="ic">▦</span>Matrice</button>
  <button data-view="day"><span class="ic">◷</span>Planning</button>
  <button data-view="notes"><span class="ic">✎</span>Notes</button>
  <button id="m-menu"><span class="ic">☰</span>Menu</button>
</nav>
<div class="scrim" id="scrim"></div>
<div id="toasts"></div>
<noscript>Cette application nécessite JavaScript.</noscript>
<script type="module" src="app.js"></script>
</body>
</html>
