<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes priorités</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='1' y='1' width='6' height='6' rx='1' fill='%23E24B4A'/><rect x='9' y='1' width='6' height='6' rx='1' fill='%23378ADD'/><rect x='1' y='9' width='6' height='6' rx='1' fill='%23EF9F27'/><rect x='9' y='9' width='6' height='6' rx='1' fill='%23888780'/></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="offline hidden" id="offline">Connexion au serveur perdue. Relance <b>Lancer.bat</b> ; la page se reconnectera toute seule.</div>
<div class="app">
  <aside>
    <h1><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="6" height="6" rx="1" fill="#E24B4A"/><rect x="9" y="1" width="6" height="6" rx="1" fill="#378ADD"/><rect x="1" y="9" width="6" height="6" rx="1" fill="#EF9F27"/><rect x="9" y="9" width="6" height="6" rx="1" fill="#888780"/></svg>Mes priorités</h1>
    <div class="nav" data-view="matrix" tabindex="0">▦ Matrice <span class="count" id="c-matrix"></span></div>
    <div class="nav" data-view="day" tabindex="0">◷ Planning <span class="count" id="c-day"></span></div>
    <div class="nav" data-view="notes" tabindex="0">✎ Notes</div>
    <div class="section-label">Projets <button class="ghost" id="add-project" title="Nouveau projet">+</button></div>
    <div id="projects"></div>
    <div class="spacer"></div>
    <div class="nav" data-view="trash" tabindex="0">🗑 Corbeille <span class="count" id="c-trash"></span></div>
    <div class="nav" id="open-settings" tabindex="0">⚙ Paramètres</div>
  </aside>

  <main>
    <div class="topbar">
      <input class="quick" id="quick" placeholder="Nouvelle tâche…  #projet  !1 à !4  ~1h30  @demain     (touche N)" autocomplete="off" maxlength="500">
      <input class="search" id="search" placeholder="Filtrer…  (touche /)" autocomplete="off">
      <label class="small muted toggle"><input type="checkbox" id="show-done"> Terminées</label>
    </div>
    <div class="view" id="view-matrix"><div class="matrix" id="matrix"></div></div>
    <div class="view hidden" id="view-day"></div>
    <div class="view hidden" id="view-notes"></div>
    <div class="view hidden" id="view-trash"></div>
  </main>

  <div class="drawer hidden" id="drawer"></div>
</div>
<div id="toasts"></div>
<script src="/app.js"></script>
</body>
</html>
